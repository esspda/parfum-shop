<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Parfum Drop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1ea; --card: #fffdf9; --text: #1d1a17; --muted: #8a8178;
    --line: #e6ddd1; --gold: #b08a4a; --gold-soft: #f1e6d3; --chip: #efe8de;
    --danger: #b4533c;
  }
  .dark {
    --bg: #12100e; --card: #1c1916; --text: #f3ece2; --muted: #9b9186;
    --line: #2d2823; --gold: #d4ad6a; --gold-soft: #2e271d; --chip: #26221d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Manrope", system-ui, sans-serif; font-size: 15px; }
  body { padding-bottom: 96px; min-height: 100vh; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }

  header { padding: 22px 18px 8px; display: flex; align-items: flex-end; justify-content: space-between; }
  header h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .5px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .cart-pill { border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13px; }
  .cart-pill b { color: var(--gold); }

  .filters { display: flex; gap: 8px; padding: 10px 18px 4px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column; text-align: left; padding: 0; color: var(--text); }
  .card .ph { aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center; position: relative; }
  .card .ph img { width: 100%; height: 100%; object-fit: contain; }
  .badge { position: absolute; top: 8px; left: 8px; background: var(--text); color: var(--bg);
    font-size: 10px; font-weight: 700; letter-spacing: .6px; padding: 4px 8px; border-radius: 999px; text-transform: uppercase; }
  .card .info { padding: 10px 12px 12px; }
  .brand { font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .card .name { font-size: 20px; line-height: 1.1; margin: 3px 0 6px; font-weight: 600; }
  .from { font-size: 13px; color: var(--gold); font-weight: 700; }

  /* detail */
  .detail .hero { background: #fff; aspect-ratio: 1.15; display: flex; align-items: center; justify-content: center; }
  .detail .hero img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .detail .body { padding: 18px; }
  .detail h2 { font-size: 34px; line-height: 1.05; margin: 4px 0 6px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .desc { line-height: 1.55; margin: 14px 0; }
  .notes { background: var(--gold-soft); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; }
  .notes span { display: block; font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  .sec { margin: 20px 0 10px; font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .vols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .vol { border: 1.5px solid var(--line); background: var(--card); color: var(--text); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .vol .ml { font-weight: 700; font-size: 15px; }
  .vol .pr { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .vol.on { border-color: var(--gold); background: var(--gold-soft); }
  .vol.on .pr { color: var(--gold); font-weight: 600; }
  .vol.full { grid-column: span 3; display: flex; justify-content: space-between; padding: 12px 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .orig { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
  .oos { color: var(--danger); font-weight: 600; margin-top: 12px; }

  /* cart */
  .cart { padding: 4px 18px; }
  .cart h2 { font-size: 30px; margin: 18px 0 12px; font-weight: 600; }
  .row { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 10px; margin-bottom: 10px; }
  .row img { width: 58px; height: 58px; object-fit: contain; background: #fff; border-radius: 10px; }
  .row .t { flex: 1; min-width: 0; }
  .row .n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 17px; line-height: 1; }
  .qty b { min-width: 16px; text-align: center; }
  .total { display: flex; justify-content: space-between; padding: 14px 4px; font-size: 17px; font-weight: 700; border-top: 1px dashed var(--line); margin-top: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }

  /* власна кнопка, якщо відкрито не в Telegram */
  #fallbackBtn { position: fixed; left: 14px; right: 14px; bottom: 14px; padding: 16px; border: 0; border-radius: 16px;
    background: var(--text); color: var(--bg); font-weight: 700; font-size: 15px; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  #backBtn { display: none; margin: 14px 18px 0; border: 0; background: none; color: var(--muted); font-size: 14px; padding: 0; }
  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-80px); transition: transform .25s;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 9; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<button id="backBtn">← Назад</button>
<main id="app"></main>
<button id="fallbackBtn"></button>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
// При запуску з кнопки клавіатури initData порожній, тому перевіряємо платформу
const inTg = !!(tg && tg.platform && tg.platform !== "unknown");
const S = { catalog: null, cart: {}, view: "list", current: null, ml: null, filter: "all" };
const $app = document.getElementById("app");

if (tg) { tg.ready(); tg.expand(); }
if ((tg && tg.colorScheme === "dark") || (!inTg && matchMedia("(prefers-color-scheme: dark)").matches))
  document.documentElement.classList.add("dark");

try { S.cart = JSON.parse(sessionStorage.getItem("cart") || "{}"); } catch (e) { S.cart = {}; }
const saveCart = () => { try { sessionStorage.setItem("cart", JSON.stringify(S.cart)); } catch (e) {} };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => n.toLocaleString("uk-UA").replace(/,/g, " ") + " грн";
const byId = id => S.catalog.aromas.find(a => a.id === id);
const FULL = () => String(S.catalog.full_bottle_ml);
const haptic = t => tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || "light");

function itemOf(key) {               // key: a-<id>-<ml>
  const [, id, ml] = key.split("-");
  const a = byId(id);
  if (!a || !a.prices[ml]) return null;
  return { a, ml, price: a.prices[ml], label: ml === FULL() ? `флакон ${ml} мл` : `${ml} мл` };
}
function cartStats() {
  let count = 0, total = 0;
  for (const [k, q] of Object.entries(S.cart)) { const it = itemOf(k); if (it) { count += q; total += it.price * q; } }
  return { count, total };
}
function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1400);
}

/* ---------- головна / нижня кнопка ---------- */
let mainHandler = null;
function setMain(text, handler) {
  mainHandler = handler;
  const fb = document.getElementById("fallbackBtn");
  if (inTg) {
    tg.MainButton.offClick(onMain);
    if (!text) { tg.MainButton.hide(); return; }
    tg.MainButton.setParams({ text, is_visible: true, is_active: true });
    tg.MainButton.onClick(onMain);
  } else {
    fb.style.display = text ? "block" : "none";
    fb.textContent = text || "";
    fb.onclick = onMain;
  }
}
function onMain() { mainHandler && mainHandler(); }
function setBack(show) {
  if (inTg) { show ? tg.BackButton.show() : tg.BackButton.hide(); }
  else document.getElementById("backBtn").style.display = show ? "block" : "none";
}
function goBack() { S.view === "cart" && S.current ? S.view = "detail" : (S.view = "list", S.current = null); render(); }
if (inTg) tg.BackButton.onClick(goBack);
document.getElementById("backBtn").onclick = goBack;

function cartButton() {
  const { count, total } = cartStats();
  setMain(count ? `Кошик · ${count} · ${money(total)}` : "", () => { S.view = "cart"; render(); });
}

/* ---------- екрани ---------- */
function minPrice(a) {
  return Math.min(...Object.entries(a.prices).filter(([ml]) => ml !== FULL()).map(([, p]) => p));
}

function renderList() {
  const { count } = cartStats();
  const genders = ["all", ...new Set(S.catalog.aromas.map(a => a.gender))];
  const list = S.catalog.aromas.filter(a => S.filter === "all" || a.gender === S.filter);
  $app.innerHTML = `
    <header>
      <div><h1 class="serif">${esc(S.catalog.shop_name)}</h1><p>Оригінальні парфуми на розпив</p></div>
      ${count ? `<button class="cart-pill" id="pill">Кошик <b>${count}</b></button>` : ""}
    </header>
    <div class="filters">${genders.map(g =>
      `<button class="chip ${S.filter === g ? "on" : ""}" data-g="${esc(g)}">${g === "all" ? "Усі" : esc(g)}</button>`).join("")}
    </div>
    <div class="grid">${list.map(a => `
      <button class="card" data-id="${a.id}">
        <div class="ph">${a.image ? `<img src="${a.image}" alt="">` : ""}
          ${!a.in_stock ? `<span class="badge">Немає</span>` : ""}</div>
        <div class="info">
          <div class="brand">${esc(a.brand)}</div>
          <div class="name serif">${esc(a.name)}</div>
          <div class="from">від ${money(minPrice(a))}</div>
        </div>
      </button>`).join("")}
    </div>`;
  $app.querySelectorAll(".chip").forEach(b => b.onclick = () => { S.filter = b.dataset.g; render(); });
  $app.querySelectorAll(".card").forEach(b => b.onclick = () => openAroma(b.dataset.id));
  const pill = document.getElementById("pill");
  if (pill) pill.onclick = () => { S.view = "cart"; render(); };
  setBack(false);
  cartButton();
}

function openAroma(id) {
  S.current = id; S.view = "detail";
  const a = byId(id);
  S.ml = Object.keys(a.prices).find(ml => ml === "5") || Object.keys(a.prices)[0];
  haptic(); render(); window.scrollTo(0, 0);
}

function renderDetail() {
  const a = byId(S.current);
  const decants = Object.entries(a.prices).filter(([ml]) => ml !== FULL());
  const full = a.prices[FULL()];
  const bigVols = decants.some(([ml]) => +ml >= 20);
  $app.innerHTML = `
    <div class="detail">
      <div class="hero">${a.image ? `<img src="${a.image}" alt="">` : ""}</div>
      <div class="body">
        <div class="brand">${esc(a.brand)}</div>
        <h2 class="serif">${esc(a.name)}</h2>
        <div class="meta">${esc(a.family)} · ${esc(a.gender)}</div>
        <p class="desc">${esc(a.description)}</p>
        <div class="notes"><span>Ноти</span>${esc(a.notes)}</div>
        ${a.in_stock ? `
          <div class="sec">Оберіть обʼєм</div>
          <div class="vols">
            ${decants.map(([ml, p]) => `
              <button class="vol ${S.ml === ml ? "on" : ""}" data-ml="${ml}">
                <div class="ml">${ml} мл</div><div class="pr">${money(p)}</div></button>`).join("")}
            ${full ? `<button class="vol full ${S.ml === FULL() ? "on" : ""}" data-ml="${FULL()}">
                <div class="ml">Повний флакон ${FULL()} мл</div><div class="pr">${money(full)}</div></button>` : ""}
          </div>
          ${bigVols ? `<div class="hint">У ціну 20 і 30 мл уже входить знижка 5% і 10%</div>` : ""}`
        : `<div class="oos">Зараз немає в наявності</div>`}
        <div class="orig">Як завжди оригінал 💯</div>
      </div>
    </div>`;
  $app.querySelectorAll(".vol").forEach(b => b.onclick = () => { S.ml = b.dataset.ml; haptic("soft"); render(); });
  setBack(true);
  if (a.in_stock) {
    setMain(`Додати ${S.ml === FULL() ? "флакон" : S.ml + " мл"} · ${money(a.prices[S.ml])}`, () => {
      const key = `a-${a.id}-${S.ml}`;
      S.cart[key] = (S.cart[key] || 0) + 1; saveCart();
      haptic("medium"); toast("Додано в кошик ✓");
      S.view = "list"; S.current = null; render();
    });
  } else setMain("", null);
}

function renderCart() {
  const entries = Object.entries(S.cart).filter(([k]) => itemOf(k));
  const { total } = cartStats();
  $app.innerHTML = `<div class="cart"><h2 class="serif">Кошик</h2>
    ${entries.length ? entries.map(([k, q]) => { const it = itemOf(k); return `
      <div class="row">
        ${it.a.image ? `<img src="${it.a.image}" alt="">` : ""}
        <div class="t"><div class="n">${esc(it.a.brand)} — ${esc(it.a.name)}</div>
          <div class="s">${it.label} · ${money(it.price)}</div></div>
        <div class="qty"><button data-k="${k}" data-d="-1">−</button><b>${q}</b><button data-k="${k}" data-d="1">+</button></div>
      </div>`; }).join("") + `<div class="total"><span>Разом</span><span>${money(total)}</span></div>`
    : `<div class="empty">Кошик порожній 🫙<br>Оберіть аромат у каталозі</div>`}
  </div>`;
  $app.querySelectorAll(".qty button").forEach(b => b.onclick = () => {
    const k = b.dataset.k; S.cart[k] = (S.cart[k] || 0) + +b.dataset.d;
    if (S.cart[k] <= 0) delete S.cart[k];
    saveCart(); haptic("soft"); render();
  });
  setBack(true);
  setMain(entries.length ? `Оформити · ${money(total)}` : "", checkout);
}

function checkout() {
  const payload = JSON.stringify({ cart: Object.entries(S.cart).filter(([k]) => itemOf(k)) });
  if (inTg) { tg.sendData(payload); }   // бот отримає кошик і продовжить оформлення в чаті
  else alert("Демо поза Telegram. Бот отримав би:\n" + payload);
}

function render() {
  ({ list: renderList, detail: renderDetail, cart: renderCart })[S.view]();
}

fetch("catalog.json", { cache: "no-store" })
  .then(r => r.json())
  .then(data => { S.catalog = data; render(); })
  .catch(() => { $app.innerHTML = `<div class="empty">Не вдалося завантажити каталог</div>`; });
</script>
</body>
</html>
